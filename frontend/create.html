<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Создать персонажа — D&D</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <div class="container">
    <header class="nav">
      <h1>Новый персонаж</h1>
      <a href="index.html" class="btn btn-secondary">← Назад</a>
    </header>

    <div class="form-group">
      <label for="char-name">Имя персонажа</label>
      <input type="text" id="char-name" placeholder="Арагорн" />
    </div>

    <div class="form-group">
      <label for="race-select">Раса</label>
      <select id="race-select"></select>
    </div>

    <div class="form-group">
      <label for="char-class">Класс</label>
      <input type="text" id="char-class" placeholder="Монах" />
    </div>

    <div class="form-group">
      <label for="char-level">Уровень</label>
      <input type="number" id="char-level" value="1" min="1" max="20" />
    </div>

    <div class="form-group">
      <label>Заклинания</label>
      <div id="spells-container" class="checkbox-grid"></div>
    </div>

    <div class="form-group">
      <label>Фокусы</label>
      <div id="feats-container" class="checkbox-grid"></div>
    </div>

    <button type="button" id="create-btn" class="btn">Создать персонажа</button>
  </div>
  <script type="module" src="js/create.js"></script>
</body>
</html>
