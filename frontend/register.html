<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Регистрация — D&D</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <div class="auth-box">
    <h1>Регистрация</h1>
    <p class="muted">Создайте аккаунт для сохранения персонажей</p>
    <form id="register-form">
      <div class="form-group">
        <label for="username">Имя пользователя</label>
        <input type="text" id="username" required autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="password">Пароль (мин. 4 символа)</label>
        <input type="password" id="password" required minlength="4" autocomplete="new-password" />
      </div>
      <p id="error" class="error" hidden></p>
      <button type="submit" class="btn">Зарегистрироваться</button>
    </form>
    <p class="muted" style="margin-top: 1.5rem">
      Уже есть аккаунт? <a href="login.html">Войти</a>
    </p>
  </div>
  <script type="module">
    import { initRegisterForm } from './js/auth.js'
    initRegisterForm()
  </script>
</body>
</html>
